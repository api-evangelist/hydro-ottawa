findings:
  summary: >-
    Hydro Ottawa is the Ontario answer to the question this study asks, and the answer is
    that a mandate can produce a real implementation and still produce nothing a developer
    can act on. Ontario did the hard thing: it wrote a regulation, named a specific
    standard and version, set a deadline and required third-party certification. Hydro
    Ottawa complied — it stood up a customer Green Button authorization portal and a
    dedicated third-party registration application, both live, both branded, both running
    today on a specialist Ontario vendor's platform. And yet from outside the utility there
    is no base URI, no endpoint, no specification, no scope list, no discovery document, no
    register entry and no public certificate. The regulation obligated the capability
    without obligating its publication, so the only way to learn how the API works is to
    apply. That is the exact inverse of the Australian CDR, where an anonymous call to the
    ACCC register proves designation and an anonymous call to /discovery/status proves
    conformance. Same idea, two continents, opposite transparency outcomes — and it is
    Ontario, the jurisdiction with the tighter standard-specific rule, that is the harder
    one to verify.
  mandateIsNotImplementation: >-
    Held apart deliberately. The obligation is recorded from the regulation and the OEB
    guidance. The operating surfaces are recorded from two live HTTP 200 applications. The
    conformance claim is recorded as a claim, because no conformant response was obtained
    and none could be requested. Every 200 returned by the vendor's SPA was control-tested
    against an invented path and discarded. Status is live-claimed-unverified, not
    live-implemented, and that is the finding rather than a shortfall in the research.
  consumerVersusMarket: >-
    The split is total and it runs the opposite way to most of this sector. Consumer data:
    mandated, built, free, consent-scoped, revocable — and undocumented and gated behind an
    application plus a certification. Market data: nothing at all, by structure — in
    Ontario the market layer belongs to the IESO, and a distributor has none to publish.
    Hydro Ottawa does not even publish generation data for Portage Power's 131 MW of
    municipally-owned renewables, nor a single dataset on the open data portal of the City
    that owns it. The one open machine-readable feed in the whole estate — live outage
    counts, 379,291 customers served — belongs to KUBRA, is undocumented, and was found by
    reading a JavaScript bootstrap config.
  vendorConcentration: >-
    The mandated API is not built by the utility. Savage Data Systems of North Bay, Ontario
    operates both the customer authorization portal and the third-party registration portal,
    and states it serves over 40 Ontario LDCs and retailers. The province mandated sixty
    utilities to implement one standard; a small number of vendors implemented it sixty
    times. Whether Ontario has sixty Green Button implementations or four vendor platforms
    wearing sixty logos is the question the regulation's aggregate certification count —
    "55 utilities' platforms" — quietly answers.
  contrastWithAustralia: >-
    CDR energy gives a public register, a published base URI per brand, unauthenticated
    discovery endpoints, a versioned standards-body OpenAPI, and centrally hosted open
    product reference data. Ontario's Green Button gives a certified private
    implementation, a login page, a registration form and a phone number. Both are genuine
    mandates. Only one is auditable from the outside.
  corporateContext: >-
    Hydro Ottawa Holding Inc. is 100 percent owned by the City of Ottawa. Hydro Ottawa
    Limited distributes electricity to roughly 372,000 customers in Ottawa and Casselman
    (the outage feed reports 379,291 customers served as of the probe date). Sister
    companies are Portage Power (Ontario's largest municipally-owned renewable generator,
    131 MW, run-of-river hydro at Chaudière Falls and plants in Ontario, Quebec and New
    York, plus 16 solar installations), Envari (energy solutions) and Hiboo Networks
    (fibre). None of them publishes an API.

