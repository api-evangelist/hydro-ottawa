actions:
  apisYmlCreated: true
  apisListed: 1
  openapiHarvested: 1
  fabricationCheck: >-
    No host, endpoint, scope, version or specification was invented. No baseURL is recorded
    for the CMD API because Hydro Ottawa publishes none. No ESPI endpoint path is attributed
    to Hydro Ottawa. No OAuth scope names are listed anywhere in this profile, because the
    only machine-readable source found carries an empty scopes object. Every 200 on the
    Savage Data host was control-tested against an invented path and discarded as SPA
    catch-all behaviour. The KUBRA outage feed is real and was called, but is excluded from
    apis.yml apis[] because it is undocumented and is not published by Hydro Ottawa. Green
    Button Download My Data is real and documented but is excluded from apis[] because it is
    a login-gated file download, not an API; it is fully described in this file instead.
