aid: hydro-ottawa
name: Hydro Ottawa
review:
  question: >-
    Ontario mandated Green Button by regulation. Does Hydro Ottawa's Green Button
    obligation resolve into a verifiable implementation, and can a developer outside
    the utility prove it?
  answer: >-
    Partly, and the gap is the finding. Hydro Ottawa operates two live, anonymously
    reachable Green Button surfaces — a customer authorization portal and a
    third-party developer registration application — which is materially more than a
    press release. But the artefact the regulation actually requires, a conformant
    ESPI resource API, could not be verified from outside: no base URI is published,
    no API reference exists, no OIDC discovery document is served, the vendor host is
    a catch-all SPA that returns HTTP 200 for every path including invented ones, and
    no public Green Button Alliance certificate register naming Hydro Ottawa could be
    located. Recorded as live-claimed-unverified, deliberately, not live-implemented.
  date: '2026-07-27'
  reviewer: API Evangelist
  homeMarket: Canada
  tier: utility-retailer
  organizationNote: >-
    Strictly, Hydro Ottawa Limited is a regulated local distribution company (a wires
    utility), not a competitive retailer. In Ontario the LDC is the party the consumer
    data mandate binds, because the LDC owns the smart meter, the interval data and
    the billing relationship. The utility-retailer tier is applied on that basis.

mandate:
  regime: green-button-ontario
  regimeName: >-
    Ontario Regulation 633/21 (Energy Data), made under the Electricity Act, 1998
    (s. 25.35.8). Requires covered Ontario electricity and natural gas distributors —
    roughly sixty utilities, with exemptions for small entities lacking smart metering
    infrastructure — to implement Green Button Download My Data (DMD) and Green Button
    Connect My Data (CMD) conforming to the North American Energy Standards Board
    Retail Energy Quadrant Book 21 (NAESB REQ.21) Energy Services Provider Interface
    (ESPI) Model Business Practices version 3.3 (published 30 January 2020), and to
    have those implementations certified by the Green Button Alliance, by 1 November
    2023. Usage information must be at intervals of one hour or less and at least 24
    months must be made available. Regulator/administrator: Ontario Energy Board.
    Standards body: NAESB. Certifier: Green Button Alliance.
  status: live-claimed-unverified
  designated: true
  designationDetail: >-
    Hydro Ottawa Limited is a licensed Ontario electricity distributor with full smart
    metering deployment and roughly 372,000 customers, so it falls squarely inside the
    covered class under O. Reg. 633/21 and none of the small-entity exemptions apply.
    The Green Button Alliance announced on 2 November 2023 that it had tested and
    certified 55 Ontario utility platforms to ESPI v3.3 against the regulation's
    deadline. That announcement is an aggregate count — it does not name individual
    utilities, and Hydro Ottawa is not named in it.
  whatWasVerified: >-
    Three things, all by anonymous HTTP on 2026-07-27, all recorded with status below.
    (1) Hydro Ottawa publishes its own Green Button service pages describing DMD and
    CMD, both HTTP 200. (2) A live customer Green Button authorization portal exists at
    https://hydroottawa.savagedata.com/Connect/Authorize, HTTP 200, Microsoft-IIS/10.0,
    a Blazor Server application whose asset names are Ottawa-branded
    (css/bootstrap/Ottawa_bootstrap.min.css, css/Ottawa_site.css) and whose bundle is
    named LDCAuthGPFrontEnd — "LDC Auth Green Button front end". (3) A live third-party
    developer registration application exists at https://ottawaonboarding.savagedata.com/,
    HTTP 200, Microsoft-IIS/10.0, HTML title "3rdPartyRegistration", stylesheet
    ThirdPartyRegistration.styles.css. Both are operated by Savage Data Systems of North
    Bay, Ontario, a 1980-founded vendor that states it serves over 40 Local Distribution
    Companies and retailers. An organization does not stand up and brand a dedicated
    third-party Green Button registration application for a service it has not built.
  whatCouldNotBeVerified: >-
    The implementation itself, in the only sense that matters to an integrator.
    (a) No ESPI base URI is published by Hydro Ottawa anywhere on its site, in its
    Green Button pages, or in any public document found. (b) No API reference, no
    endpoint list, no scope list and no first-party specification exists. (c) No
    anonymously served OpenID Connect discovery document was found on any Hydro Ottawa
    or Savage Data host. (d) Endpoint probing against the vendor host is impossible:
    https://hydroottawa.savagedata.com/ is a catch-all Blazor Server SPA that returns
    HTTP 200 with byte-identical HTML for /DataCustodian, /espi/1_1/resource/,
    /oauth/authorize, /oauth/token, /api/v1, /.well-known/openid-configuration AND for
    the deliberately invented control path /this-path-should-not-exist-12345. Every one
    of those 200s is the SPA shell, not an endpoint, and none of them is treated here as
    evidence of anything. (e) The Green Button Alliance publishes no public certified-
    products register at a discoverable URL — /certified, /certifications,
    /certified-products and /certified-utilities all return HTTP 404 — so Hydro Ottawa's
    GBA certification could not be confirmed by name from a primary source.
  claimVsImplementation: >-
    Hydro Ottawa's own statement — "Third-party providers who want to integrate with
    Hydro Ottawa's Green Button services must complete the onboarding process [and]
    test and certify their solution with the Green Button Alliance (GBA)" — is a claim.
    The two live Blazor applications are operational evidence and rank well above a
    claim. A conformant ESPI response is proof, and no such response was obtained,
    because Hydro Ottawa publishes nothing that would let an outsider request one.
    Contrast the Australian CDR sibling profiles in this network, where designation is
    provable from the ACCC CDR Register in one anonymous call and conformance is provable
    from unauthenticated /cds-au/v1/discovery/status. Ontario built the mandate without
    building the register, the public discovery endpoint or the published base URI, so
    Ontario's mandate is structurally unverifiable from outside the utility. The mandate
    replicated; the accountability surface did not.

dataStandard:
  name: NAESB REQ.21 Energy Services Provider Interface (ESPI) v3.3 — Green Button
  mandatedVersion: '3.3'
  mandatedBy: Ontario Regulation 633/21 (Energy Data), Electricity Act, 1998
  implementedVersionVerified: false
  implementedVersionNote: >-
    Hydro Ottawa states its data is in "machine-readable XML format" and names Green
    Button and the Green Button Alliance, but never names an ESPI version on any page
    read. v3.3 is the version the regulation compels; it is recorded as the mandated
    version, not as an observed one. Public reporting indicates the Savage Data Systems
    "SDS Green Engine" Data Custodian product is compliant with the NAESB 3.3 standard;
    that is a vendor/press claim, not something verified here.
  documents:
  - title: Green Button API Documentation (ESPI 4.0)
    format: OpenAPI 3.0.0
    paths: 7
    saved: openapi/hydro-ottawa-green-button-espi-openapi.yml
    sourceURL: https://raw.githubusercontent.com/GreenButtonAlliance/OpenAPI-Green-Button-Documentation/main/green-button-openapi.yaml
    sourceRepository: https://github.com/GreenButtonAlliance/OpenAPI-Green-Button-Documentation
    httpStatus: 200
    fetched: '2026-07-27'
    bytes: 20333
    parses: true
    servers:
    - https://sandbox.greenbuttonalliance.org:8443/DataCustodian
    pathsList:
    - /espi/1_1/resource/ApplicationInformation
    - /espi/1_1/resource/ApplicationInformation/{applicationInformationId}
    - /espi/1_1/resource/Authorization
    - /espi/1_1/resource/Authorization/{authorizationId}
    - /espi/1_1/resource/Batch/Bulk/{bulkId}
    - /espi/1_1/resource/UsagePoint
    - /espi/1_1/resource/UsagePoint/{usagePointId}
    securitySchemes: >-
      A single oauth2 scheme with authorizationCode and clientCredentials flows,
      authorizationUrl https://sandbox.greenbuttonalliance.org:8443/oauth/authorize and
      tokenUrl https://sandbox.greenbuttonalliance.org:8443/oauth/token. The scopes
      object is empty in the source document — no scope names were invented here.
    provenanceNote: >-
      This document is NOT Hydro Ottawa's. It is authored and published by the Green
      Button Alliance and was harvested verbatim; only an x-provenance / x-source-url /
      x-source-repository / x-harvested block was added under info. Two caveats are
      recorded on the artifact itself and repeated here: it describes ESPI 4.0 while
      Ontario mandates ESPI 3.3, and its servers[] point at the GBA's own sandbox, not
      at any Hydro Ottawa host. It is included because it is the only real, parseable,
      machine-readable contract in the Green Button ecosystem and it is the family the
      Hydro Ottawa CMD API belongs to — not because Hydro Ottawa serves it.
  otherStandardsFound: >-
    None. No CDR Consumer Data Standards (Canada has no consumer data right in energy),
    no OpenADR, no IEEE 2030.5, no IEC CIM 61968/61970, no OCPP or OCPI reference was
    found on any Hydro Ottawa surface. hydroottawa.com/en/ev-charging,
    /en/electric-vehicle and /en/demand-response all return HTTP 404. The FlexSaver
    demand-flexibility programme at https://gridflex.hydroottawa.com/ (HTTP 200) is a
    consumer sign-up page with no protocol or API reference.

consumerVsMarketData:
  consumerDataAPI: true
  consumerDataDetail: >-
    Yes — a third party can obtain an individual Hydro Ottawa customer's smart meter
    interval consumption and billing data through Green Button Connect My Data, because
    O. Reg. 633/21 compels it. Hydro Ottawa's own pages describe the mechanics: the
    authorization must be initiated inside the third-party application, which redirects
    the customer into Hydro Ottawa's Green Button authentication; the customer chooses
    the data types, the duration and the frequency and can revoke at any time from
    account settings; personally identifiable information is transmitted separately from
    usage data; the service is free of charge. Data covers electricity consumption from
    the smart meter at the meter's own interval (15-minute, hourly or daily) plus billing
    data — payments, generation and distribution charges, demand charges, third-party
    charges — for up to 24 months, with an offline form for older data. Marked true on the
    strength of the mandate plus two live operating surfaces. It is emphatically not
    marked verified: no base URI, no endpoint, no scope and no conformant response was
    obtained, and none was invented.
  downloadMyData:
    exists: true
    detail: >-
      Green Button Download My Data is live and separately documented: up to 24 months of
      usage and billing data as Green Button XML (also Excel and PDF) from the Green Button
      portal or MyAccount. It is behind a customer login — MyAccount credentials, or the
      20-digit account number plus total kWh consumption plus bill due date from a recent
      bill. Deliberately NOT listed in apis.yml apis[]: it is a documented data service and
      a real ESPI-format export, but it is a portal file download behind a customer
      credential, not a programmatic API, and Hydro Ottawa publishes no endpoint for it.
      Requests beyond 24 months go through a human form at
      https://hydroottawa.com/en/accounts-services/services/request-additional-electricity-meter-data.
  marketDataOpen: false
  marketDataDetail: >-
    No. Hydro Ottawa publishes no open grid, market, system or asset data as a product.
    There is no open-data portal, no dataset licence, no feed catalogue and no download
    page. In Ontario the open market layer belongs to the IESO, the independent system
    operator, not to the distributor — a distributor in this market has no market data to
    publish. The City of Ottawa's own open data portal was checked directly: its DCAT feed
    at https://open.ottawa.ca/api/feed/dcat-us/1.1.json returned HTTP 200 with 682 datasets
    and exactly one string match on "hydro", a City greenhouse gas emissions dashboard —
    the municipally-owned utility contributes nothing to its owner's open data portal.
    Notably, Hydro Ottawa also publishes nothing about Portage Power's 131 MW of renewable
    generation: no output feed, no emissions feed, no generation data.
  undocumentedOpenFeed:
    finding: >-
      One genuinely open, anonymous, machine-readable feed carrying Hydro Ottawa data does
      exist, and it is not Hydro Ottawa's to give. https://outages.hydroottawa.com/ is a
      KUBRA StormCenter deployment (product 5.52.0) whose bootstrap config exposes
      instanceId 75aa35eb-53c1-42e0-b705-d8abcf71334a and viewId
      671ab4e4-6e66-453f-9179-040b44c3f155 in page source. Those identifiers resolve to a
      live public JSON API on kubra.io that answers without a key, a header or a referer.
      It is undocumented vendor infrastructure with no publisher, no terms, no licence, no
      version guarantee and no stability commitment. It is recorded here as a probe result
      and is deliberately excluded from apis.yml apis[], which carries only real,
      documented APIs. It is also the reason market_data_open is recorded as false rather
      than true: a feed an application happens to leave reachable is not a utility
      publishing open data.
    verified:
    - url: https://outages.hydroottawa.com/
      httpStatus: 200
      note: HTML title "Hydro Ottawa Outage Map"; KUBRA StormCenter bootstrap config inline in page source.
    - url: https://kubra.io/stormcenter/api/v1/stormcenters/75aa35eb-53c1-42e0-b705-d8abcf71334a/views/671ab4e4-6e66-453f-9179-040b44c3f155/currentState?preview=false
      httpStatus: 200
      contentType: application/json
      auth: none — fully anonymous
      note: >-
        Returned tileFormat QUADKEY_JSON, stormcenterDeploymentId
        fa5c4be8-143c-42fb-8ed2-de34b28e0dea, updatedAt 1785154770000, and a data block
        whose interval_generation_data pointer was data/bf99fc84-ce72-42d6-9d69-fab09af3c149.
    - url: https://kubra.io/data/bf99fc84-ce72-42d6-9d69-fab09af3c149/public/summary-1/data.json
      httpStatus: 200
      contentType: application/json
      auth: none — fully anonymous
      note: >-
        Live system summary at 2026-07-27T12:19:30Z — total_cust_a 18 customers affected,
        total_outages 5, total_cust_s 379,291 customers served, total_percent_cust_active
        99.99, page_mode BLUESKY.

accessGate:
  gate: application-approval
  gated: true
  whatADeveloperMustDo: >-
    Exactly two steps, both stated by Hydro Ottawa and neither of them self-serve.
    First, complete Hydro Ottawa's third-party onboarding process at
    https://ottawaonboarding.savagedata.com/ — a live Blazor Server application titled
    "3rdPartyRegistration", operated by Savage Data Systems, reachable anonymously at
    HTTP 200 but publishing no documentation, no endpoint list, no specification and no
    credentials on its public shell. Second, test and certify the resulting solution with
    the Green Button Alliance (https://www.greenbuttonalliance.org/testing), which Hydro
    Ottawa says "ensures consistent, secure and standards-compliant implementation". Only
    after both does an integrator receive connection details; nothing about the API is
    published beforehand. There is no sandbox, no API key form, no trial, no pricing page
    and no rate-limit document. Each authorized data pull additionally requires the
    individual customer to complete Hydro Ottawa's Green Button authorization, initiated
    from inside the third-party app. Human fallback for everything else is (613) 738-6400.
  selfServeSignup: false
  publicDeveloperPortal: false
  developerPortalNote: >-
    ottawaonboarding.savagedata.com is recorded as the developer portal because it is a
    real, live, anonymously reachable, developer-facing surface — not a customer login —
    and it is the only entry point Hydro Ottawa offers an integrator. It is not a
    developer portal in the ordinary sense: no docs, no reference, no keys, no console.
  portalEvidence:
  - url: https://ottawaonboarding.savagedata.com/
    httpStatus: 200
    server: Microsoft-IIS/10.0
    note: Live third-party registration application. HTML title "3rdPartyRegistration". Blazor Server.
  - url: https://developer.hydroottawa.com/
    dnsResolves: false
    httpStatus: 000
  - url: https://developers.hydroottawa.com/
    dnsResolves: false
    httpStatus: 000
  - url: https://developersdev.hydroottawa.com/
    dnsResolves: true
    dnsChain: 104.18.21.108 / 104.18.20.108 (Cloudflare)
    httpStatus: 530
    note: >-
      A non-production developer-portal hostname is present in certificate transparency
      logs and resolves through Cloudflare, but the origin is unreachable (HTTP 530). The
      matching production hostname does not exist. Read as: a developer portal was at some
      point stood up in a dev environment and never shipped. NOT counted as a portal.
  - url: https://api.hydroottawa.com/
    dnsResolves: true
    httpStatus: 403
    server: cloudflare
    note: >-
      A production API hostname exists (and a *.api.hydroottawa.com wildcard certificate is
      in CT logs) but returns HTTP 403 at root and HTTP 404 for /v1, /api, /swagger,
      /swagger.json, /openapi.json, /api-docs, /health, /.well-known/openid-configuration,
      /DataCustodian and /espi. Internal or partner infrastructure, not a public programme.
  - url: https://docs.hydroottawa.com/
    dnsResolves: false
    httpStatus: 000
  - url: https://data.hydroottawa.com/
    dnsResolves: false
    httpStatus: 000
  - url: https://gb.hydroottawa.com/
    dnsResolves: false
    httpStatus: 000
    note: Present in certificate transparency logs (as is gbdev.hydroottawa.com) but does not resolve publicly.

authModel:
  consumerData: >-
    OAuth 2.0 authorization code, per the ESPI/Green Button model — the customer is
    redirected from the third-party application into Hydro Ottawa's Green Button
    authentication, selects data types, duration and frequency, and can revoke later. This
    is the standard's model and is consistent with Hydro Ottawa's description of its own
    flow; the concrete authorization and token endpoints are NOT published and were NOT
    observed, so none are recorded. The harvested GBA specification carries an oauth2
    scheme with authorizationCode and clientCredentials flows and an EMPTY scopes object —
    no scope names were invented.
  downloadMyData: >-
    Customer credential only. MyAccount username and password, or bill-derived
    verification: 20-digit account number plus total kWh consumption plus bill due date.
  outageFeed: >-
    None. Anonymous HTTP GET against kubra.io. No key, no header, no referer check.
  openidConfiguration:
    probed:
    - url: https://hydroottawa.com/.well-known/openid-configuration
      httpStatus: 404
    - url: https://www.hydroottawa.com/.well-known/openid-configuration
      httpStatus: 404
    - url: https://api.hydroottawa.com/.well-known/openid-configuration
      httpStatus: 404
    - url: https://hydroottawa.savagedata.com/.well-known/openid-configuration
      httpStatus: 200
      note: >-
        DISCOUNTED. The 200 is the Blazor SPA shell, byte-identical to the response for the
        invented control path /this-path-should-not-exist-12345. Not a discovery document.
    result: >-
      No anonymously served OpenID Connect discovery document exists on any Hydro Ottawa
      or Savage Data host.

